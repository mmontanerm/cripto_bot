# ============================================================
#  CRIPTO-BOT · Configuració
#  Estratègia: TENDÈNCIA LLARG/CURT (la del laboratori), en SIMULACIÓ.
#  La mida de les posicions i el fre d'emergència es poden canviar
#  des del panell. La resta, editant aquest fitxer a GitHub: el bot
#  es recarrega sol i, si hi ha un error, continua amb l'anterior.
# ============================================================

mode: paper            # paper = diners simulats (únic mode disponible)
exchange: kraken       # d'on es llegeixen els preus en directe
timeframe: 1h          # espelmes d'1 hora, com al laboratori
poll_seconds: 60       # cada quants segons revisa preus i stops

# Els mateixos 6 valors del laboratori (en EUR a Kraken)
symbols:
  - BTC/EUR
  - ETH/EUR
  - SOL/EUR
  - XRP/EUR
  - DOGE/EUR
  - ADA/EUR

# ---------- Compte simulat (costos de futurs amb ordres a mercat, com al laboratori) ----------
paper:
  initial_capital: 1000.0   # EUR simulats
  fee_pct: 0.05             # comissió per costat (%)
  slippage_pct: 0.02        # lliscament per costat (%)
  funding_8h_pct: 0.01      # les posicions llargues paguen això cada 8 hores; a les curtes no se'ls compta cap ingrés

# ---------- Estratègia: paràmetres FIXOS (la combinació que el laboratori va triar més vegades) ----------
estrategia:
  canal_entrada_h: 168      # entra en llarg si tanca per sobre del màxim de les últimes 168 h (7 dies); en curt, per sota del mínim
  canal_sortida_h: 84       # surt d'un llarg si tanca per sota del mínim de les últimes 84 h; d'un curt, per sobre del màxim
  stop_atr: 4.0             # stop de pèrdues a 4 × ATR del preu d'entrada
  atr_h: 24                 # ATR (moviment mitjà per hora) calculat amb 24 hores

# ---------- Risc (es pot canviar des del panell) ----------
risc:
  exposicio_pct: 60         # part del capital que fa servir, repartida a parts iguals entre els 6 valors
  caiguda_maxima_pct: 15    # si el capital cau això des del màxim, ho tanca tot i s'atura
