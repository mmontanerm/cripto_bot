# Configuració de Render (Blueprint): bot 24/7 + panell web en un sol servei.
# A Render: New → Blueprint → tria aquest repositori de GitHub.
services:
  - type: web                 # servei web: el bot treballa en segon pla i el panell té adreça pròpia
    name: cripto-bot-web
    runtime: python
    plan: starter             # el pla gratuït s'adorm i no admet discos
    region: frankfurt         # el centre de dades més proper a Barcelona
    branch: main
    autoDeploy: true          # cada canvi a GitHub (p. ex. a config.yaml) actualitza el bot
    buildCommand: pip install -r requirements.txt
    startCommand: python run_bot.py
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /var/data      # l'estat i els logs van al disc persistent
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DASHBOARD_PASSWORD
        sync: false           # la contrasenya del panell: la poses tu a Render, mai a GitHub
    disk:
      name: cripto-bot-web-data
      mountPath: /var/data
      sizeGB: 1
